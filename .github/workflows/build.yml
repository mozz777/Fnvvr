name: Build fnvvr APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, cmod_bionic]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # No recursive submodules: the repo lists an sdl2 submodule with no URL,
      # which makes a recursive checkout fail. We fetch the two we need by hand.
      - uses: actions/checkout@v4

      - name: Fetch OpenXR-SDK submodule
        run: git submodule update --init --depth 1 app/src/main/cpp/OpenXR-SDK

      - name: Fetch SDL2 (stock release, replaces the unpublished pinned commit)
        run: |
          rm -rf app/src/main/cpp/sdl2
          git clone --depth 1 --branch release-2.32.8 https://github.com/libsdl-org/SDL app/src/main/cpp/sdl2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: fnvvr-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
